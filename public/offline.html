  <title>You're offline · DailyManager</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0c0d;color:#f4f2ef;font:16px system-ui,sans-serif}.card{width:min(100%,440px);padding:28px;border:1px solid #34393c;border-radius:22px;background:#171a1c}h1{font-size:25px;margin:0 0 10px}p{color:#aeb6b8;line-height:1.6}button{margin-top:14px;padding:12px 16px;border:0;border-radius:10px;background:#ffc09d;color:#291109;font-weight:700}
  </style>

<body><main class="card"><h1>You're offline</h1><p>Reconnect to the internet to sign in or refresh your workspace. If you've used DailyManager on this device before, open the app again to access its saved workspace data.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
