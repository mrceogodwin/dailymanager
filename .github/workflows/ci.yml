name: DailyManager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint application
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
        env:
          # Build-time placeholders only; production database credentials are never stored here.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/dailymanager
